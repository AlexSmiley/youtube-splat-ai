services:
  worker:
    build:
      context: .
      args:
        INSTALL_KERAS: ${INSTALL_KERAS:-false}
    gpus: all
    ports: ['127.0.0.1:8000:8000']
    volumes: ['./data:/data']
    environment:
      COLMAP_CPU: ${COLMAP_CPU:-false}
      ORIGINS: ${ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - '127.0.0.1:5173:5173'
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --strictPort"
    depends_on:
      - worker
volumes:
  frontend_modules:
